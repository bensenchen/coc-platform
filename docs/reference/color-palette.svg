<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title">
  <title id="title">COC Platform colour palette</title>
  <rect width="960" height="320" fill="#f8fafc"/>
  <text x="36" y="46" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">COC Platform palette</text>
  <g font-family="Inter, Arial, sans-serif"><g transform="translate(36 76)"><rect width="136" height="104" rx="12" fill="#4f46e5"/><text y="130" fill="#0f172a" font-size="14" font-weight="700">Brand indigo</text><text y="151" fill="#64748b" font-size="13">#4F46E5</text></g><g transform="translate(200 76)"><rect width="136" height="104" rx="12" fill="#7c3aed"/><text y="130" fill="#0f172a" font-size="14" font-weight="700">Brand violet</text><text y="151" fill="#64748b" font-size="13">#7C3AED</text></g><g transform="translate(364 76)"><rect width="136" height="104" rx="12" fill="#0f172a"/><text y="130" fill="#0f172a" font-size="14" font-weight="700">Sidebar / ink</text><text y="151" fill="#64748b" font-size="13">#0F172A</text></g><g transform="translate(528 76)"><rect width="136" height="104" rx="12" fill="#f7f8fc" stroke="#cbd5e1"/><text y="130" fill="#0f172a" font-size="14" font-weight="700">Canvas</text><text y="151" fill="#64748b" font-size="13">#F7F8FC</text></g><g transform="translate(692 76)"><rect width="136" height="104" rx="12" fill="#fde68a"/><text y="130" fill="#0f172a" font-size="14" font-weight="700">Management</text><text y="151" fill="#64748b" font-size="13">#FDE68A</text></g></g>
  <text x="36" y="270" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">Use #4F46E5 for primary actions and focus; #7C3AED for project accents; #0F172A for the project navigation.</text>
</svg>
